<a href="{{ project_url }}" class="project card glass-card h-100 d-flex flex-column text-decoration-none" {% if project.external_url %}target="_blank" rel="noopener noreferrer"{% endif %}>
  {% if project_img %}
    <div style="overflow: hidden; border-radius: 15px 15px 0 0;">
      <img class="card-img-top project-img-zoom" src="{{ project_img | relative_url }}" alt="{{ project_name }}">
    </div>
  {% endif %}
  <div class="card-body d-flex flex-column flex-grow-1">
    <h5 class="card-title font-weight-bold" style="color: inherit;">{{ project_name }}</h5>
    <p class="card-text text-muted mb-4">{{ project_desc | truncatewords: 25 }}</p>
    
    {% if project_tools %}
      <div class="project-tools mb-3 mt-auto">
        {% for tool in project_tools %}
          <span class="badge badge-pill rounded-pill" style="margin-right: 4px; margin-bottom: 4px;">{{ tool }}</span>
        {% endfor %}
      </div>
    {% else %}
      <div class="mt-auto"></div>
    {% endif %}
    
    <div class="d-flex justify-content-between align-items-center mt-3 pt-3" style="border-top: 1px solid rgba(150, 150, 150, 0.2);">
      <span class="read-more-text font-weight-bold" style="color: #29d6cd; font-size: 0.9rem;">Read More</span>
      <i class="fas fa-arrow-right" style="color: #29d6cd;"></i>
    </div>
  </div>
</a>
