<div class="row justify-content-center align-items-center p-4" style="position: relative; overflow: hidden; min-height: 80vh;" id="home-hero">
  <!-- Particle container -->
  <div id="particles-js" style="position: absolute; width: 100%; height: 100%; top: 0; left: 0; z-index: 0; pointer-events: none;"></div>
  
  <div class="col-lg-6 col-md-8 text-center mt-5 mx-auto" style="position: relative; z-index: 1;">
    <!-- Centered & Responsive Avatar -->
    <div class="d-flex justify-content-center">
      <div class="avatar-container" style="width: 100%; max-width: 540px;">
        {% if site.author.image %}
          <img class="img-fluid rounded-circle shadow-lg mx-auto" src="profile.jpg" alt="{{ site.title }}" style="object-fit: cover;">
        {% else %}
          <img class="img-fluid rounded-circle shadow-lg mx-auto" src="https://ui-avatars.com/api/?name={{ site.title }}&background=random" alt="{{ site.title }}" style="object-fit: cover;">
        {% endif %}
      </div>
    </div>

    <h1 class="mt-4 wow animated slideInUp" data-wow-delay=".1s" style="font-weight: 700;">Hi, I'm {{ site.title }}</h1>
    
    <p class="text-muted wow animated slideInUp mt-3" style="font-size: 1.1rem; max-width: 600px; margin: 0 auto;" data-wow-delay=".15s">
      {{ site.description }}
    </p>

    <!-- Social Media Buttons -->
    <div class="mt-4 d-flex justify-content-center wow animated slideInUp" data-wow-delay=".2s" style="gap: 2rem;">
      <a class="btn btn-outline-dark btn-lg shadow-sm d-flex align-items-center resume wow animated slideInUp" data-wow-delay=".3s" href="Resume.pdf">
        <i class="fas fa-file-pdf" style="margin-right: 8px;"></i>
        <span>Resume</span>
      </a>
      <a class="btn btn-outline-dark btn-lg shadow-sm d-flex align-items-center github wow animated slideInUp" data-wow-delay=".4s" href="https://github.com/vishnumandala">
        <i class="fab fa-github" style="margin-right: 8px;"></i>
        <span>GitHub</span>
      </a>
      <a class="btn btn-outline-dark btn-lg shadow-sm d-flex align-items-center linkedin wow animated slideInUp" data-wow-delay=".5s" href="https://www.linkedin.com/in/vishnumandala">
        <i class="fab fa-linkedin-in" style="margin-right: 8px;"></i>
        <span>LinkedIn</span>
      </a>
    </div>
  </div>
</div>

<!-- Scroll Down Arrow -->
<div class="text-center mt-4">
  <div class="scroll-down" id="scrollArrow" onclick="scrollToAbout()">
    <i class="fas fa-chevron-down"></i>
  </div>
</div>

<!-- tsParticles Library -->
<script src="https://cdn.jsdelivr.net/npm/tsparticles-preset-links@2/tsparticles.preset.links.bundle.min.js"></script>
<script>
document.addEventListener('DOMContentLoaded', function() {
  tsParticles.load("particles-js", {
    preset: "links",
    particles: {
      number: { value: 60, density: { enable: true, value_area: 800 } },
      color: { value: ["#03a1e0", "#00ffdd"] },
      links: { enable: true, color: "#29d6cd", opacity: 0.3, distance: 150 },
      move: { enable: true, speed: 1.5 },
      size: { value: 3 }
    },
    background: {
      color: "transparent"
    },
    interactivity: {
      events: { onHover: { enable: true, mode: "grab" } },
      modes: { grab: { distance: 140, links: { opacity: 0.5 } } }
    }
  });
});
</script>
