<nav class="navbar navbar-expand-lg navbar-themed site-navbar">
  <div class="container px-0">
    <a class="navbar-brand brand-wordmark" href="{{ '/' | relative_url }}">{{ site.title }}</a>

    <button class="navbar-toggler border-0" type="button" data-toggle="collapse" data-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
      <i class="fas fa-bars"></i>
    </button>

    <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
      <div class="navbar-nav ml-auto align-items-lg-center">
        <a class="nav-item nav-link {% if page.url == '/' %}active{% endif %}" href="{{ '/' | relative_url }}">Home</a>
        <a class="nav-item nav-link {% if page.url contains '/projects/' %}active{% endif %}" href="{{ '/projects/' | relative_url }}">Projects</a>

        {% if page.url == '/' %}
          <button class="nav-item nav-link nav-anchor-btn" type="button" onclick="scrollToAbout()">About</button>
        {% else %}
          <a class="nav-item nav-link {% if page.url == '/about/' %}active{% endif %}" href="{{ '/about/' | relative_url }}">About</a>
        {% endif %}

        <div class="nav-divider d-none d-lg-block" aria-hidden="true"></div>

        <a class="nav-item nav-link nav-icon" href="https://linkedin.com/in/{{ site.author.linkedin }}" target="_blank" rel="noopener" aria-label="LinkedIn">
          <i class="fab fa-linkedin"></i>
        </a>
        <a class="nav-item nav-link nav-icon" href="https://github.com/{{ site.author.github }}" target="_blank" rel="noopener" aria-label="GitHub">
          <i class="fab fa-github"></i>
        </a>
        <button class="nav-item nav-link nav-icon btn btn-link p-0" id="theme-toggle" type="button" aria-label="Toggle theme">
          <i class="fas fa-moon" id="theme-icon"></i>
        </button>
      </div>
    </div>
  </div>
</nav>
